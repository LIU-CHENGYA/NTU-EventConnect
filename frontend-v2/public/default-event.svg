<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2e5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d4a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f7fe8;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#7ba7ff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="680" cy="80" r="160" fill="#4f7fe8" opacity="0.08" />
  <circle cx="700" cy="60" r="100" fill="#4f7fe8" opacity="0.07" />
  <circle cx="100" cy="380" r="120" fill="#4f7fe8" opacity="0.06" />

  <!-- Bottom accent band -->
  <rect x="0" y="380" width="800" height="70" fill="url(#accent)" />

  <!-- Subtle grid dots -->
  <g opacity="0.06" fill="#ffffff">
    <circle cx="60" cy="60" r="2" /><circle cx="120" cy="60" r="2" /><circle cx="180" cy="60" r="2" />
    <circle cx="60" cy="120" r="2" /><circle cx="120" cy="120" r="2" /><circle cx="180" cy="120" r="2" />
    <circle cx="60" cy="180" r="2" /><circle cx="120" cy="180" r="2" /><circle cx="180" cy="180" r="2" />
    <circle cx="620" cy="300" r="2" /><circle cx="680" cy="300" r="2" /><circle cx="740" cy="300" r="2" />
    <circle cx="620" cy="360" r="2" /><circle cx="680" cy="360" r="2" /><circle cx="740" cy="360" r="2" />
  </g>

  <!-- Calendar icon — centered: x=(800-90)/2=355, y=(450-80-40-22)/2=154 -->
  <g transform="translate(355, 144)">
    <rect x="0" y="10" width="90" height="80" rx="8" fill="none" stroke="#7ba7ff" stroke-width="3" opacity="0.8"/>
    <rect x="0" y="10" width="90" height="22" rx="8" fill="#4f7fe8" opacity="0.7"/>
    <rect x="0" y="24" width="90" height="8" fill="#4f7fe8" opacity="0.7"/>
    <line x1="22" y1="4" x2="22" y2="20" stroke="#7ba7ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="68" y1="4" x2="68" y2="20" stroke="#7ba7ff" stroke-width="3" stroke-linecap="round"/>
    <g fill="#7ba7ff" opacity="0.7" font-family="sans-serif" font-size="10" text-anchor="middle">
      <text x="18" y="55">●</text>
      <text x="36" y="55">●</text>
      <text x="54" y="55">●</text>
      <text x="72" y="55">●</text>
      <text x="18" y="75">●</text>
      <text x="36" y="75">●</text>
      <text x="54" y="75" fill="#ffffff" opacity="1">✓</text>
    </g>
  </g>

  <!-- Title -->
  <text x="400" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22"
    font-weight="600" fill="#ffffff" opacity="0.85" text-anchor="middle" letter-spacing="2">
    NTU EventConnect
  </text>
</svg>
