name: Deploy NTU EventConnect to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'backend-v2/**'
              - 'fetch_data/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - 'frontend-v2/**'
              - '.github/workflows/deploy.yml'

  deploy-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_DIR
          script: |
            set -e
            cd ~/NTU-EventConnect

            echo "Active backend dir: $BACKEND_DIR"

            echo "Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            if grep -q "^BACKEND_DIR=" .env; then
              sed -i "s|^BACKEND_DIR=.*|BACKEND_DIR=$BACKEND_DIR|" .env
            else
              echo "BACKEND_DIR=$BACKEND_DIR" >> .env
            fi

            if grep -q "^GOOGLE_CLIENT_ID=" ./${BACKEND_DIR}/.env; then
              sed -i "s|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}|" ./${BACKEND_DIR}/.env
            else
              echo "GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> ./${BACKEND_DIR}/.env
            fi
            
            echo "Rebuilding backend container ($BACKEND_DIR)..."
            docker compose up -d --build backend

            echo "Pruning old images..."
            docker image prune -f

            echo "Waiting for health check..."
            sleep 20
            for i in 1 2 3 4 5; do
              if curl -sf "${{ secrets.VITE_API_URL }}/api/health" | grep -q '"status":"ok"'; then
                echo "Backend deployed successfully ($BACKEND_DIR)"
                exit 0
              fi
              echo "Retry $i/5..."
              sleep 10
            done
            echo "Health check failed"
            docker compose logs backend --tail 50
            exit 1
        env:
          BACKEND_DIR: ${{ vars.BACKEND_DIR || 'backend' }}

  deploy-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './${{ vars.FRONTEND_DIR }}/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./${{ vars.FRONTEND_DIR }}
        run: npm ci

      - name: Set Frontend Environment Variables
        working-directory: ./${{ vars.FRONTEND_DIR }}
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env.production
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env.production

      - name: Build React App
        working-directory: ./${{ vars.FRONTEND_DIR }}
        run: npm run build

      - name: Sync hashed assets to S3
        run: |
          aws s3 sync ./${{ vars.FRONTEND_DIR }}/dist s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync index.html to S3
        run: |
          aws s3 cp ./${{ vars.FRONTEND_DIR }}/dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"
